{% load django_datastar static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}django-datastar example{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'example/django-datastar-icon.svg' %}">
    <link rel="stylesheet" href="{% static 'example/site.css' %}">
    {% datastar_csrf %}
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.3/bundles/datastar.js"
    ></script>
  </head>
  <body>
    <header class="site-header">
      <a class="site-brand" href="{% url 'home' %}">
        <img
          class="site-brand__logo"
          src="{% static 'example/django-datastar-logo.svg' %}"
          alt="django-datastar"
          width="1080"
          height="240"
        >
      </a>
      <nav aria-label="Primary navigation">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'request_metadata' %}">Request metadata</a>
        <a href="{% url 'csrf_demo' %}">CSRF</a>
      </nav>
    </header>
    <main>
      {% block main %}{% endblock %}
    </main>
  </body>
</html>

{% extends "base.html" %}

{% block title %}Staff sign in | django-datastar example{% endblock %}

{% block main %}
  <h1>Staff sign in</h1>
  <p>Use your local staff account to open Signal diagnostics.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="{{ form.username.id_for_label }}">Username</label>
    {{ form.username }}
    <label for="{{ form.password.id_for_label }}">Password</label>
    {{ form.password }}
    <button type="submit">Sign in</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
{% endblock %}

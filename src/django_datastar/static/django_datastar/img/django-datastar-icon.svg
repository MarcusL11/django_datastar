<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">django-datastar icon</title>
  <desc id="description">A custom lowercase d with the Datastar pixel rocket launching toward a star.</desc>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="#123b2a"/>

  <!-- An original lowercase d, drawn independently of the Django wordmark. -->
  <circle cx="206" cy="300" r="102" fill="none" stroke="#f7f5ef" stroke-width="52"/>
  <path d="M308 104v298" fill="none" stroke="#f7f5ef" stroke-width="52" stroke-linecap="round"/>

  <!-- Small data stars remain visible without competing with the main mark. -->
  <path d="M405 284l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#ffc857"/>
  <circle cx="429" cy="252" r="7" fill="#55d6be"/>

  <!-- Official Datastar rocket, used with permission and embedded below. -->
  <image x="263" y="45" width="230" height="230" image-rendering="pixelated" href="data:image/png;base64,"/>
</svg>

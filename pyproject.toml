[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-datastar"
version = "0.1.0"
description = "Request metadata and opt-in CSRF integration for Django and Datastar"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Marcus A. Lee", email = "hello@marcusalee.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "Django>=5.2,<6.1",
]

[project.urls]
Documentation = "https://django-datastar.readthedocs.io/"
Repository = "https://github.com/MarcusL11/django_datastar"
Issues = "https://github.com/MarcusL11/django_datastar/issues"

[project.optional-dependencies]
tests = [
  "django-stubs>=5.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-django>=4.10",
]
docs = [
  "furo>=2024.8.6",
  "Sphinx>=8.1",
]

[dependency-groups]
dev = [
  "build>=1.2.2",
  "django-stubs>=5.2",
  "furo>=2024.8.6",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-django>=4.10",
  "ruff>=0.11",
  "Sphinx>=8.1",
  "twine>=6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_datastar"]

[tool.hatch.build.targets.sdist]
include = [
  "/docs",
  "/example",
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests/typing_example.py"]
mypy_path = "src"
warn_unused_configs = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "SIM", "TID", "UP", "W"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]

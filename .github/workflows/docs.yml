name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sphinx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[docs]"
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        django: ["5.2", "6.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Test the wheel outside the checkout
        run: |
          python -m venv /tmp/django-datastar-wheel
          /tmp/django-datastar-wheel/bin/pip install dist/*.whl pytest pytest-django "Django~=${{ matrix.django }}.0"
          mkdir /tmp/django-datastar-tests
          cp -R tests /tmp/django-datastar-tests/tests
          cat > /tmp/django-datastar-tests/pytest.ini <<'EOF'
          [pytest]
          DJANGO_SETTINGS_MODULE = tests.settings
          EOF
          cd /tmp/django-datastar-tests
          /tmp/django-datastar-wheel/bin/python -m pytest tests/test_middleware.py tests/test_csrf.py
      - name: Test the example application against the installed wheel
        run: |
          /tmp/django-datastar-wheel/bin/python "$GITHUB_WORKSPACE/example/manage.py" check
          /tmp/django-datastar-wheel/bin/python "$GITHUB_WORKSPACE/example/manage.py" test example

  node:
    name: Node ${{ matrix.node }} browser-module tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Test the JavaScript shipped in the wheel
        run: |
          unzip -q dist/*.whl -d /tmp/django-datastar-wheel
          DATASTAR_CSRF_MODULE="/tmp/django-datastar-wheel/django_datastar/static/django_datastar/datastar-csrf.js" node tests/test_datastar_csrf.mjs

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[tests]" ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Enforce package artifact contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          allowed = {
              ".gitignore",
              "HISTORY.rst",
              "docs",
              "example",
              "src",
              "tests",
              "LICENSE",
              "PKG-INFO",
              "README.md",
              "pyproject.toml",
          }
          archive = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(archive) as distribution:
              members = distribution.getnames()
          relative_members = {"/".join(Path(member).parts[1:]) for member in members}
          unexpected = []
          for member in members:
              relative = Path(member).parts[1:]
              if relative and relative[0] not in allowed:
                  unexpected.append(member)
          if unexpected:
              raise SystemExit(f"Unexpected sdist files: {unexpected}")

          required = {
              "example/README.rst",
              "example/manage.py",
              "example/example/__init__.py",
              "example/example/settings.py",
              "example/example/urls.py",
              "example/example/views.py",
              "example/example/tests.py",
          }
          missing = required - relative_members
          if missing:
              raise SystemExit(f"Missing required sdist files: {sorted(missing)}")
          for prefix in ("example/example/templates/", "example/example/static/"):
              if not any(member.startswith(prefix) for member in relative_members):
                  raise SystemExit(f"Missing required sdist content under {prefix}")

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as distribution:
              wheel_members = distribution.namelist()
          included_example = [member for member in wheel_members if member.startswith("example/")]
          if included_example:
              raise SystemExit(f"Example project unexpectedly included in wheel: {included_example}")
          PY
      - name: Smoke-test the installed wheel
        run: |
          python -m venv /tmp/django-datastar-wheel
          /tmp/django-datastar-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/django-datastar-wheel/bin/python "$GITHUB_WORKSPACE/tests/installed_package_check.py"
